<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>График курьеров</title><style>
:root{--bg:#f4f5fb;--fg:#1b1d2a;--mut:#6c7090;--card:#fff;--line:#e4e6f2;--acc:#5b6cff;--acc2:#8b5bff;--day:#fff3d6;--dayf:#8a5a00;--ngt:#e7e4ff;--ngf:#4a3bb5;--bad:239,68,68;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#10111a;--fg:#ececf5;--mut:#9a9cba;--card:#1a1c2a;--line:#2b2e44;--acc:#7d8bff;--acc2:#a07dff;--day:#4a3a12;--dayf:#ffd78a;--ngt:#2d2a5c;--ngf:#c9c2ff}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.shell{max-width:1240px;margin:0 auto;padding:16px}
.top{display:flex;gap:12px;justify-content:space-between;align-items:flex-start;padding:20px;border-radius:16px;color:#fff;background:linear-gradient(120deg,var(--acc),var(--acc2));box-shadow:0 8px 24px rgba(91,108,255,.25);margin-bottom:14px}
.top h1{margin:0 0 4px;font-size:22px}.top p{margin:0;opacity:.9;font-size:13px}
.badge{background:rgba(255,255,255,.22);border-radius:99px;padding:4px 12px;font-size:12px;white-space:nowrap}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}
.tabs button{white-space:nowrap}
button,input,select{font:inherit;color:var(--fg)}
button,select{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 14px;cursor:pointer;transition:transform .15s,box-shadow .15s,background .2s}
button:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.1)}
button:active{transform:scale(.97)}
button.on,button.pub{background:linear-gradient(120deg,var(--acc),var(--acc2));border-color:transparent;color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.tools input{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 8px}
details{width:100%}summary{cursor:pointer;color:var(--mut)}
.gh{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--card);box-shadow:0 2px 10px rgba(0,0,0,.04)}
table{border-collapse:separate;border-spacing:0;width:100%}
th,td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:6px 4px;text-align:center;min-width:58px;font-size:13px;transition:background .25s}
th{background:var(--bg);position:sticky;top:0;z-index:1}th small{display:block;color:var(--mut);font-weight:400}
th.we{color:var(--acc)}
.sticky{position:sticky;left:0;z-index:2;background:var(--card)}th.sticky{background:var(--bg);z-index:3}
td.name{text-align:left;min-width:130px;padding-left:10px;font-weight:600}
td a{color:inherit;text-decoration:none;white-space:nowrap}td a:hover{color:var(--acc)}
tbody tr{animation:rowin .35s ease both}
tbody tr:hover td{background:rgba(125,139,255,.08)}
tr.me td{background:rgba(125,139,255,.2)!important}
@keyframes rowin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
tr.grp th{position:static;text-align:left;padding:8px 12px;font-size:13px;background:linear-gradient(90deg,rgba(125,139,255,.2),transparent)}
.grp span{background:var(--acc);color:#fff;border-radius:99px;padding:0 8px;font-size:11px;margin-left:6px}
.chip{display:inline-block;min-width:50px;text-align:center;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600}
.chip.d{background:var(--day);color:var(--dayf)}.chip.n{background:var(--ngt);color:var(--ngf)}.chip.o{background:rgba(var(--bad),.2)}
.off{color:var(--mut);font-size:12px}
td input{width:100%;border:0;background:transparent;padding:8px 4px;text-align:center}
td.name input{text-align:left;padding-left:8px}
td input:focus{outline:2px solid var(--acc);outline-offset:-2px;border-radius:6px;background:var(--bg)}
th.fri{color:var(--acc);background:rgba(125,139,255,.14)}th.we{color:var(--acc);background:rgba(125,139,255,.26)}
td.fri{background:rgba(125,139,255,.08)}td.we{background:rgba(125,139,255,.16)}
td.bad{background:rgba(var(--bad),.2)}
td.sel{background:rgba(91,108,255,.35)!important;box-shadow:inset 0 0 0 2px var(--acc)}
.cv{display:block;padding:8px 4px;min-height:34px;cursor:cell}
.selmode{user-select:none}th.clk,td.clk{cursor:pointer}
.selbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.selbar input{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 8px}
.x{border:0;background:none;color:var(--mut);padding:2px 8px}
.my{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin:0 0 12px;position:relative}
.my div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;transition:all .3s}
.my b{display:block;font-size:17px}
.hint{color:var(--mut);font-size:13px;margin-top:8px}
.heat{font-weight:600}.heat small{display:block;font-weight:400;color:var(--mut)}
.two th:not(.sticky){position:static}.two th input{width:64px;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:3px 4px;text-align:center}
.cnt{font-weight:600}
tbody tr:hover td.sticky{background:linear-gradient(rgba(125,139,255,.08),rgba(125,139,255,.08)),var(--card)}
tr.me td.sticky{background:linear-gradient(rgba(125,139,255,.2),rgba(125,139,255,.2)),var(--card)!important}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
.mbox{background:var(--card);border-radius:16px;padding:18px;max-width:420px;width:100%;display:flex;flex-direction:column;gap:10px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.mbox textarea{border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:10px;padding:8px 10px;font:inherit;resize:vertical}
.cmt{white-space:pre-wrap;line-height:1.5}
.nm{width:140px;min-width:140px;max-width:140px}
.nm.ed{width:280px;min-width:280px;max-width:280px}
.fade-enter-active,.fade-leave-active{transition:opacity .2s,transform .2s}
.fade-enter-from{opacity:0;transform:translateY(8px)}.fade-leave-to{opacity:0;transform:translateY(-8px)}
.card-enter-from,.card-leave-to{opacity:0;transform:scale(.9)}.card-leave-active{position:absolute}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#1b1d2a;color:#fff;padding:10px 18px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.3);z-index:10;max-width:90vw}
.toast.err{background:#c62828}
.toast-enter-active,.toast-leave-active{transition:all .3s}
.toast-enter-from,.toast-leave-to{opacity:0;transform:translate(-50%,20px)}
.dirty{color:#d97706;font-size:13px}
.foot{text-align:center;margin-top:20px;font-size:12px}.foot a{color:var(--mut)}
.gate form{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.gate input{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px}
.loading{padding:40px;text-align:center;color:var(--mut)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><div id="app"></div><script type="text/x-template" id="tpl">
<div v-if="!S" class="loading">Загрузка…</div>
<div v-else class="shell">
  <header class="top">
    <div><h1>График курьеров</h1><p>Смена «8-20» — с 8:00 до 20:00, «20-8» — ночная, с 20:00 до 8:00 следующего дня.</p></div>
    <span v-if="editor" class="badge">Режим редактора</span>
  </header>
  <section v-if="admin&&!editor" class="card gate">
    <div v-if="auth==='checking'">Проверка…</div>
    <form v-else-if="auth==='login'" @submit.prevent="login">
      <b>Вход в редактор</b>
      <input type="password" v-model="pw" placeholder="Пароль" autocomplete="current-password">
      <button class="pub" :disabled="busy">Войти</button>
    </form>
    <form v-else-if="auth==='setup'" @submit.prevent="setup">
      <b>Первый запуск: задайте пароль редактора</b>
      <p class="hint" style="width:100%;margin:0">Пароль сохранится в репозитории в виде хэша (файл data/auth.json). Для записи нужны репозиторий и токен GitHub.</p>
      <input v-model.trim="G.repo" placeholder="user/repo" @change="saveG">
      <input v-model.trim="G.branch" placeholder="ветка" style="width:90px" @change="saveG">
      <input type="password" v-model.trim="G.token" placeholder="Токен GitHub" @change="saveG">
      <input type="password" v-model="pw" placeholder="Новый пароль (от 6 символов)" autocomplete="new-password">
      <input type="password" v-model="pw2" placeholder="Повторите пароль" autocomplete="new-password">
      <button class="pub" :disabled="busy">Задать пароль</button>
    </form>
    <div v-else>Не удалось проверить пароль. <button @click="checkAuth">Повторить</button></div>
  </section>
  <nav v-if="editor" class="tabs">
    <button v-for="t in tabs" :key="t.id" :class="{on:tab===t.id}" @click="tab=t.id">{{t.name}}</button>
  </nav>
  <section v-if="editor" class="card tools">
    <label>Начало: <input type="date" v-model="S.start" @change="touch"></label>
    <label>Дней в графике: <input type="number" min="1" max="366" :value="nd" style="width:80px" @change="applyDays($event.target.value);$event.target.value=nd"></label>
    <button @click="applyDays(nd+7)">+7 дней</button>
    <button @click="addCourier">+ Курьер</button>
    <button class="pub" :disabled="busy" @click="publish">{{busy?"Публикую…":"Опубликовать на GitHub"}}</button>
    <span v-if="dirty" class="dirty">Есть неопубликованные изменения</span>
    <details><summary>Настройки GitHub</summary>
      <div class="gh">
        <label>Репозиторий: <input v-model.trim="G.repo" placeholder="user/repo" @change="saveG"></label>
        <label>Ветка: <input v-model.trim="G.branch" style="width:90px" @change="saveG"></label>
        <label>Токен: <input type="password" v-model.trim="G.token" @change="saveG"></label>
      </div>
    </details>
  </section>

  <Transition name="fade" mode="out-in">
    <div :key="cur">
      <template v-if="cur===0">
        <select v-model.number="me" style="margin-bottom:12px">
          <option :value="-1">Показать всех</option>
          <option v-for="(n,i) in S.names" :key="i" :value="i">Я — {{n}}</option>
        </select>
        <TransitionGroup v-if="me>=0" name="card" tag="div" class="my">
          <div v-for="s in myShifts" :key="s.k">{{s.label}}, {{s.wd}}<b>{{s.v}}</b></div>
        </TransitionGroup>
        <div v-if="!vdays.length" class="hint">График закончился: все даты в прошлом. Добавьте дни или сдвиньте дату начала.</div>
        <div class="tw"><table>
          <thead><tr><th class="sticky nm">Курьер</th><th>Телефон</th><th v-for="d in vdays" :key="d.k" :class="{we:d.we,fri:d.fri}">{{d.label}}<small>{{d.wd}}</small></th></tr></thead>
          <tbody v-for="g in groups" :key="g.id" v-show="g.rows.length"><tr class="grp"><th :colspan="vdays.length+2">{{g.icon}} {{g.name}} <span>{{g.rows.length}}</span></th></tr><tr v-for="i in g.rows" :key="i" :class="{me:i===me}">
            <td class="sticky name nm" :class="{clk:S.comments[i]}" @click="S.comments[i]&&(popup=i)">{{S.names[i]}}<span v-if="S.comments[i]"> 💬</span></td>
            <td><a v-if="tel(S.phones[i])" :href="'tel:'+tel(S.phones[i])">{{S.phones[i]}}</a></td>
            <td v-for="d in vdays" :key="d.k" :class="dcl(d.k)"><span v-if="!S.cells[i][d.k]" class="off">вых</span><span v-else-if="!ended(d.k,S.cells[i][d.k])" class="chip" :class="chipClass(S.cells[i][d.k])">{{S.cells[i][d.k]}}</span></td>
          </tr></tbody>
        </table></div>
      </template>

      <template v-else-if="cur===1">
        <div class="card selbar">
          <button :class="{on:selMode}" @click="toggleSelMode">{{selMode?"Выйти из режима выделения":"Выделить ячейки"}}</button>
          <template v-if="selMode">
            <span>Выбрано: <b>{{sel.size}}</b></span>
            <button :disabled="!sel.size" @click="copyCells">Копировать</button>
            <button :disabled="!sel.size||!clipN" @click="pasteCells">Вставить</button>
            <button :disabled="!sel.size" @click="clearCells">Очистить ячейки</button>
            <span class="hint" style="margin:0;width:100%">Выделяйте ячейки кликом или протяжкой мыши (Shift+клик — прямоугольник, клик по дате или имени — столбец или строка). Одну скопированную ячейку можно вставить сразу во все выделенные, а блок вставится от левой верхней выделенной ячейки.</span>
          </template>
        </div>
        <div class="tw" :class="{selmode:selMode}"><table>
          <thead><tr><th class="sticky nm ed">Курьер</th><th>Категория</th><th>Телефон</th><th>Комментарий</th><th v-for="d in vdays" :key="d.k" :class="{we:d.we,fri:d.fri,clk:selMode}" @click="selMode&&toggleCol(d.k)">{{d.label}}<small>{{d.wd}}</small></th><th></th></tr></thead>
          <tbody v-for="g in groups" :key="g.id" v-show="g.rows.length"><tr class="grp"><th :colspan="vdays.length+5">{{g.icon}} {{g.name}} <span>{{g.rows.length}}</span></th></tr><tr v-for="i in g.rows" :key="i">
            <td class="sticky name nm ed" :class="{clk:selMode}" @click="selMode&&toggleRow(i)"><input v-if="!selMode" v-model="S.names[i]" @change="touch"><span v-else class="cv">{{S.names[i]}}</span></td>
            <td><select v-model="S.cats[i]" @change="touch"><option v-for="c in CATS" :key="c.id" :value="c.id">{{c.name}}</option></select></td>
            <td><input type="tel" v-model.trim="S.phones[i]" style="min-width:130px" @change="touch"></td>
            <td><input v-model="S.comments[i]" placeholder="Комментарий" style="min-width:240px;text-align:left;padding-left:8px" @change="touch"></td>
            <td v-for="d in vdays" :key="d.k" :class="[dcl(d.k),{bad:S.cells[i][d.k]&&!parse(S.cells[i][d.k]),sel:selMode&&isSel(i,d.k)}]" @mousedown="cellDown(i,d.k,$event)" @mouseenter="cellEnter(i,d.k)"><input v-if="!selMode" v-model.trim="S.cells[i][d.k]" @change="touch"><span v-else class="cv">{{S.cells[i][d.k]}}</span></td>
            <td><button class="x" @click="removeCourier(i)">✕</button></td>
          </tr></tbody>
        </table></div>
        <div class="hint">Красным — неверный формат. Пусто — выходной.</div>
      </template>

      <template v-else-if="cur===3">
        <div class="card selbar">
          <b>Вставка столбцом</b>
          <select v-model.number="pasteDay"><option v-for="d in days" :key="d.k" :value="d.k">{{d.label}} {{d.wd}}</option></select>
          <textarea v-model="pasteText" rows="3" placeholder="Вставьте сюда данные из другой таблицы: значения с 00:00 до 23:00 столбцом" style="flex:1;min-width:240px;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:8px;padding:6px 8px;font:inherit"></textarea>
          <button class="pub" :disabled="!pasteText.trim()" @click="pasteColumn">Вставить в столбец</button>
          <span class="hint" style="margin:0;width:100%">Либо скопируйте столбец в другой таблице, встаньте в первую ячейку нужного дня в таблице ниже и нажмите Ctrl+V (Cmd+V).</span>
        </div>
        <div class="tw"><table>
          <thead><tr><th class="sticky">Час</th><th v-for="d in days" :key="d.k" :class="{we:d.we,fri:d.fri}">{{d.label}}<small>{{d.wd}}</small></th></tr></thead>
          <tbody><tr v-for="h in 24" :key="h">
            <th class="sticky">{{String(h-1).padStart(2,"0")}}:00</th>
            <td v-for="k in nd" :key="k" :class="dcl(k-1)"><input inputmode="numeric" v-model.trim="O[k-1][h-1]" @change="saveO" @paste="onPaste(k-1,h-1,$event)"></td>
          </tr></tbody>
        </table></div>
        <div class="hint">Заказы хранятся только в этом браузере и в репозиторий не попадают.</div>
      </template>

      <template v-else>
        <div class="card selbar">
          <label>Общий прирост заказов, %: <input type="number" step="1" v-model.number="gr.all" @change="saveGr" style="width:80px"></label>
          <span class="hint" style="margin:0;flex:1;min-width:220px">Заказы берутся из вкладки «Заказы по часам» и умножаются на (1 + прирост/100). Например, было 200, прирост 10% — считаем 220. Для отдельного дня впишите свой процент в строке «Прирост, %» ниже.</span>
        </div>
        <div class="tw"><table class="two">
          <thead>
            <tr><th class="sticky" rowspan="2">Час</th><th v-for="d in days" :key="d.k" colspan="2" :class="{we:d.we,fri:d.fri}">{{d.label}}<small>{{d.wd}}</small></th></tr>
            <tr><template v-for="d in days" :key="d.k"><th :class="{we:d.we,fri:d.fri}"><small>Курьеров</small></th><th :class="{we:d.we,fri:d.fri}"><small>Заказов на курьера</small></th></template></tr>
            <tr><th class="sticky">Прирост, %</th><th v-for="d in days" :key="d.k" colspan="2" :class="{we:d.we,fri:d.fri}"><input type="number" step="1" v-model="gr.days[d.k]" :placeholder="gr.all||0" @change="saveGr"></th></tr>
          </thead>
          <tbody><tr v-for="h in 24" :key="h">
            <th class="sticky">{{String(h-1).padStart(2,"0")}}:00</th>
            <template v-for="k in nd" :key="k">
              <td class="cnt" :class="dcl(k-1)">{{L[k-1][h-1]}}</td>
              <td class="heat" :class="dcl(k-1)" :style="heat(k-1,h-1)">{{ratio(k-1,h-1)}}<small>{{planTxt(k-1,h-1)}} зак.</small></td>
            </template>
          </tr></tbody>
        </table></div>
        <div class="hint">В каждом дне два столбца: число курьеров на линии и заказов на одного курьера (с учётом прироста). Под числом — ожидаемое число заказов. Цвет ячейки: меньше 3 заказов на курьера — без цвета, от 3 — жёлтый, от 4 — оранжевый, от 5 — красный (∞ — заказы есть, курьеров нет).</div>
      </template>
    </div>
  </Transition>
  <footer class="foot"><a v-if="!admin" href="#/admin">Редактор</a><a v-else-if="!isFile" href="#/" @click="logout">Выйти из редактора</a></footer>
  <Transition name="fade">
    <div v-if="popup!==null&&S.names[popup]!==undefined" class="modal" @click.self="popup=null">
      <div class="mbox">
        <b>{{S.names[popup]}}</b>
        <div v-if="S.phones[popup]" class="hint" style="margin:0">{{S.phones[popup]}}</div>
        <textarea v-if="editor" v-model="S.comments[popup]" @change="touch" rows="5" placeholder="Комментарий к курьеру"></textarea>
        <div v-else class="cmt">{{S.comments[popup]}}</div>
        <button class="pub" @click="popup=null">Закрыть</button>
      </div>
    </div>
  </Transition>
</div>
<Transition name="toast"><div v-if="msg" class="toast" :class="{err:isErr}">{{msg}}</div></Transition>
</script><script src="https://cdn.jsdelivr.net/npm/vue@3.5.13/dist/vue.global.prod.js"></script><script>
const {createApp,ref,reactive,computed,onMounted}=Vue;
const KO="courier-orders-v1",KD="courier-draft-v1",KG="courier-gh-v1",DAYS=14,WD=["Вс","Пн","Вт","Ср","Чт","Пт","Сб"];
const blank=()=>Array.from({length:DAYS},()=>Array(24).fill(""));
const sample=()=>{const names=[],cells=[];for(let i=0;i<8;i++){names.push("Курьер "+(i+1));cells.push(Array.from({length:DAYS},(_,k)=>(k+i)%4<2?(i>=4?"20-8":"8-20"):""))}
  return{start:new Date().toISOString().slice(0,10),names,phones:names.map(()=>""),cells,norm:3}};
const CATS=[{id:"m",name:"Утренние курьеры",icon:"🌅"},{id:"d",name:"Дневные курьеры",icon:"☀️"},{id:"e",name:"Вечерние курьеры",icon:"🌆"},{id:"n",name:"Ночные курьеры",icon:"🌙"}];
const jget=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
const jset=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
